version: 2

# Policy notes:
# 1. Cooldowns align npm workspaces with our 21-day Airlock `minimumReleaseAge: 30240` policy.
# 2. Weekly grouped PRs are scoped to `minor` + `patch` and suppress routine
#    `version-update:semver-major` PRs via `ignore` (so breaking major framework
#    jumps are handled intentionally rather than turning the weekly PR red).
#    Security/CVE updates bypass both `cooldown` and `ignore`.
updates:
  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"

  # Maintain dependencies for JS/TS samples workspace
  - package-ecosystem: "npm"
    directory: "/"
    versioning-strategy: "lockfile-only"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 21
    groups:
      samples-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

  # Maintain dependencies for Go samples
  - package-ecosystem: "gomod"
    directories:
      - "/agentic-patterns/go"
      - "/eli5_go"
      - "/simple-chatbot/go"
      - "/quickstarts/backend-frameworks/go/*"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      go-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

  # Maintain dependencies for Python samples workspace
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      py-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

  # Maintain dependencies for Dart and Flutter samples
  - package-ecosystem: "pub"
    directories:
      - "/a2ui-reservations_dart"
      - "/agentic-patterns/dart"
      - "/eli5_dart"
      - "/eli5_dart/flutter"
      - "/quickstarts/app-frameworks/flutter"
      - "/quickstarts/backend-frameworks/dart/shelf"
      - "/simple-chatbot/flutter"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      dart-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
