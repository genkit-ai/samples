name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-js:
    name: Build JS/TS Samples
    runs-on: ubuntu-latest
    env:
      NG_CLI_ANALYTICS: false
      ASTRO_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build all JS/TS samples
        run: pnpm run build:all-samples

  build-go:
    name: Build Go Samples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.26"
          cache-dependency-path: "**/go.sum"
      - name: Build, vet, and test all Go samples
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r mod; do
            dir="$(dirname "$mod")"
            echo "::group::$dir"
            (
              cd "$dir"
              go build ./...
              go vet ./...
              go test ./...
            )
            echo "::endgroup::"
          done < <(find . -name go.mod | sort)

  check-py:
    name: Check Python Samples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen --all-packages
      - name: Syntax check Python samples
        run: uv run --no-sync python -m compileall -q quickstarts/backend-frameworks/py
      - name: Smoke check Python sample imports
        env:
          GEMINI_API_KEY: dummy-ci-key
        run: |
          uv run --no-sync --directory quickstarts/backend-frameworks/py/django python manage.py check
          uv run --no-sync --directory quickstarts/backend-frameworks/py/fastapi python -c "import main"
          uv run --no-sync --directory quickstarts/backend-frameworks/py/flask python -c "import main"

  check-dart:
    name: Check Dart Samples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Dart
        uses: dart-lang/setup-dart@2286a0c042b44434fe26d292bbce8d34f7ec662b # v1.8.2
      - name: Analyze and test Dart samples
        run: |
          for dir in \
            agentic-patterns/dart \
            eli5_dart \
            quickstarts/backend-frameworks/dart/shelf; do
            echo "::group::$dir"
            (
              cd "$dir"
              dart pub get
              dart analyze
              if [ -d test ]; then
                dart test
              fi
            )
            echo "::endgroup::"
          done

  check-flutter:
    name: Check Flutter Samples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true
      - name: Analyze and test Flutter samples
        run: |
          for dir in \
            a2ui-reservations_dart \
            eli5_dart/flutter \
            quickstarts/app-frameworks/flutter \
            simple-chatbot/flutter; do
            echo "::group::$dir"
            (
              cd "$dir"
              flutter pub get
              flutter analyze --no-fatal-infos
              if [ -d test ]; then
                flutter test
              fi
            )
            echo "::endgroup::"
          done
